# ===========================================================================
# DAY-04 STEP 6c — JdbcUserRepositoryIT is about to break, and the reason
# is worth more than the fix.
# ===========================================================================
#
# That test says @ActiveProfiles("jdbc-it"). It has been getting
# JdbcUserRepository because that bean had NO @Profile — it was the default,
# so it matched no matter what. The test never asked for it; it just got it.
#
# After 6a it names itself "jdbc", and "jdbc-it" is not "jdbc". So the test
# would now find NO UserRepository bean at all and fail at startup.
#
# TWO THINGS ARE BEING CONFLATED IN ONE PROFILE NAME, and they are different:
#
#     jdbc     selects the BEAN            (which implementation)
#     jdbc-it  loads THIS FILE             (which database)
#
# FIX: open JdbcUserRepositoryIT and make it activate BOTH —
# @ActiveProfiles({"jdbc", "jdbc-it"}). @ActiveProfiles REPLACES the active
# profiles rather than adding to them, which is why naming only one is not
# enough.
#
# Worth noticing: the old arrangement worked by ACCIDENT, not by intent.
# "jdbc-it is not test, and the JDBC bean matches everything that is not
# test" happened to be true, and nobody had to think about it. That is the
# same shape as persona's @Profile("!test") — an arrangement that is correct
# only while nothing new exists.
# ===========================================================================

