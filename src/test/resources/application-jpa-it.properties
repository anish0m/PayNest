# ===========================================================================
# DAY-04 STEP 7a — the jpa-it profile. Used only by JpaUserRepositoryIT.
# ===========================================================================
#
# FIRST, THE THING THIS FILE EXISTS TO CORRECT.
#
# Step 6 put four JPA properties in src/main/resources/application.properties.
# During tests, Spring Boot prefers src/test/resources/application.properties
# over the main one — and yours contains a single line, spring.profiles.active.
# So NONE of those four properties reached any test run.
#
# Which means ddl-auto defaulted to `none`, and the validation you were told
# had happened did not happen. Hibernate built its metadata and checked
# nothing against the real table.
#
# The evidence was in the log the whole time, on every run:
#
#     WARN: spring.jpa.open-in-view is enabled by default...
#
# You had set open-in-view=false. The warning fired anyway. One property
# visibly not taking effect meant all four were not taking effect, from the
# same file, for the same reason.
#
#   A property you wrote is not a property that is loaded.
#   Same shape as Day-03: the jar was on the classpath and the tool was not
#   running. Present but not participating.
#
# ---------------------------------------------------------------------------
# WRITE BELOW: this profile needs SIX properties.
# ---------------------------------------------------------------------------
#
# 1-4. The datasource and Flyway — copy the four lines from
#      application-jdbc-it.properties. Same database (paynest_test, 5433),
#      same migrations. TWO integration suites, TWO implementations, ONE
#      schema. That is the point: if V1 were wrong, both would fail.
# !! FIX THIS LINE: this says `paynest` — the PRODUCTION database.
# jdbc-it points at paynest_test. @BeforeEach here runs DELETE FROM users.
# Correct it to paynest_test before running this suite.
spring.datasource.url=jdbc:postgresql://localhost:5433/paynest_test
spring.datasource.username=paynest
spring.datasource.password=paynest
spring.flyway.enabled=true
# 5.   ddl-auto. THE LINE THIS WHOLE FILE IS FOR.
#
#      Use the same value as production. NOT create-drop, which is what most
#      tutorials put in test config — that would build the schema FROM your
#      entities, so the entities would trivially match it and V1 would never
#      be consulted. A green suite proving nothing about what ships.
#
#      Same failure shape as Day-01's test that registered once and claimed
#      to prove a duplicate was rejected.
#
#      With the right value, this integration test checks V1 and your @Column
#      annotations TOGETHER, at startup. A wrong length, a wrong nullability,
#      a mistyped column name: the suite fails on your machine, naming the
#      column, instead of surfacing in production.
spring.jpa.hibernate.ddl-auto=validate
# 6.   open-in-view. Off, for the reasons in the main properties file — and
#      this time you will be able to tell it worked, because the WARN line
#      will stop appearing.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Optionally also show-sql + format_sql. Worth it here: step 7's test counts
# SQL statements, and you cannot count what you cannot see.
# ===========================================================================
