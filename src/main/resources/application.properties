spring.application.name=paynest

server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5433/paynest

spring.datasource.username=paynest
spring.datasource.password=paynest

spring.flyway.enabled=true

spring.profiles.active=jpa

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
