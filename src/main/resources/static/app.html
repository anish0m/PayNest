<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Apply the saved theme before anything paints (no flash). -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('paynest.theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <nav class="navbar border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="app.html">
                <img src="img/logo.png" alt="" width="32" height="32">PayNest
            </a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-theme-toggle
                        aria-label="Toggle light/dark theme">
                    <span class="theme-icon-light">☀️ Light</span>
                    <span class="theme-icon-dark">🌙 Dark</span>
                </button>
                <div class="dropdown">
                    <button type="button" class="btn btn-link text-body text-decoration-none d-flex align-items-center gap-2 p-1"
                            data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu">
                        <span id="user-avatar" class="avatar" aria-hidden="true"></span>
                        <span id="user-handle" class="d-none d-sm-inline fw-semibold"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><h6 id="user-name" class="dropdown-header"></h6></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button type="button" class="dropdown-item" id="logout-btn">Log out</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h4 mb-4">Hi, <span id="user-first"></span></h1>
        <!-- Wallet card (task 8) and categories (task 9) go here. -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
