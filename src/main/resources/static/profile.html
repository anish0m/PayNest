<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background:
                    radial-gradient(circle at 12% 10%, var(--pw-blue-100), transparent 25rem),
                    linear-gradient(135deg, var(--cloud), var(--paper));
            color: var(--ink);
            font-family: var(--font-body);
        }

        .profile-page {
            min-height: 100vh;
            padding: 2rem clamp(1rem, 4vw, 4rem);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 68rem;
            margin: 0 auto 2rem;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .brand-mark {
            width: 3.25rem;
            height: 3.25rem;
            object-fit: cover;
            display: block;
        }

        .brand-name {
            margin: 0;
            color: var(--ink);
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .signup-link {
            color: var(--pw-blue-700);
            font-weight: 700;
            text-decoration: none;
        }

        .signup-link:hover {
            color: var(--pw-blue-500);
            text-decoration: underline;
        }

        .profile-shell {
            width: min(100%, 68rem);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(17rem, 0.8fr) minmax(24rem, 1.2fr);
            gap: 1.25rem;
            align-items: stretch;
        }

        .panel {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 0.5rem;
            box-shadow: 0 1rem 3rem rgba(53, 53, 74, 0.1);
        }

        .lookup-panel,
        .details-panel {
            padding: clamp(1.25rem, 3vw, 2rem);
        }

        .eyebrow {
            margin-bottom: 0.65rem;
            color: var(--pw-blue-700);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 0.65rem;
            color: var(--ink);
            font-family: var(--font-display);
            font-size: clamp(1.85rem, 4vw, 2.5rem);
            line-height: 1.12;
            letter-spacing: 0;
        }

        .muted-text,
        .form-text,
        .empty-text {
            color: var(--ink-soft);
        }

        .form-label {
            color: var(--ink-soft);
            font-weight: 600;
        }

        .form-control {
            min-height: 3rem;
            color: var(--ink);
            background-color: var(--cloud);
            border-color: var(--pw-ash-300);
            border-radius: 0.5rem;
        }

        .form-control:focus {
            background-color: var(--paper);
            border-color: var(--pw-blue-500);
            box-shadow: 0 0 0 0.2rem var(--pw-blue-100);
        }

        .btn-primary-paynest {
            min-height: 3rem;
            border: 0;
            border-radius: 0.5rem;
            background: var(--pw-blue-500);
            color: var(--paper);
            font-weight: 700;
        }

        .btn-primary-paynest:hover,
        .btn-primary-paynest:focus {
            background: var(--pw-blue-700);
            color: var(--paper);
        }

        .avatar {
            width: 6.5rem;
            height: 6.5rem;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 1.25rem;
            background: var(--pw-blue-100);
            color: var(--pw-blue-700);
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
        }

        .profile-name {
            margin: 0;
            color: var(--ink);
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3vw, 2rem);
            letter-spacing: 0;
        }

        .username-badge {
            display: inline-flex;
            align-items: center;
            min-height: 2rem;
            margin-top: 0.75rem;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background: var(--pw-pink-100);
            color: var(--pw-pink-900);
            font-weight: 700;
        }

        .detail-list {
            margin: 2rem 0 0;
            display: grid;
            gap: 0.85rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--line);
        }

        .detail-row:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--ink-soft);
            font-weight: 600;
        }

        .detail-value {
            color: var(--ink);
            font-weight: 700;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .feedback {
            display: none;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
        }

        .feedback.error {
            display: block;
            background: var(--coral-bg);
            color: var(--coral);
        }

        .feedback.success {
            display: block;
            background: var(--mint-bg);
            color: var(--mint);
        }

        .profile-empty {
            min-height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 3rem 1rem;
        }

        .profile-empty img {
            width: min(55%, 13rem);
            margin-bottom: 1.25rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .profile-shell {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<main class="profile-page">
    <nav class="topbar" aria-label="Profile navigation">
        <div class="brand-row">
            <img class="brand-mark" src="public/paynest-logo.png" alt="" aria-hidden="true">
            <p class="brand-name">PayNest</p>
        </div>
        <a class="signup-link" href="signup.html">Create another account</a>
    </nav>

    <div class="profile-shell">
        <section class="panel lookup-panel" aria-labelledby="lookup-title">
            <p class="eyebrow">Profile</p>
            <h1 id="lookup-title">Find your account</h1>
            <p class="muted-text mb-4">Enter the email used during signup to load the saved profile.</p>

            <form id="profileLookupForm">
                <label for="profileEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="profileEmail" name="email"
                       autocomplete="email" required>
                <div class="form-text">Use the exact email from signup.</div>
                <button type="submit" class="btn btn-primary-paynest w-100 mt-4">Load profile</button>
            </form>

            <div id="profileFeedback" class="feedback" role="status"></div>
        </section>

        <section class="panel details-panel" aria-labelledby="profile-title">
            <div id="emptyProfile" class="profile-empty">
                <div>
                    <img src="public/paynest-logo.png" alt="">
                    <p class="empty-text mb-0">Your profile details will appear here.</p>
                </div>
            </div>

            <article id="profileDetails" class="hidden">
                <div class="avatar" id="avatarInitials" aria-hidden="true">PN</div>
                <p class="eyebrow">Account details</p>
                <h2 id="profile-title" class="profile-name"></h2>
                <div class="username-badge" id="profileUsername"></div>

                <div class="detail-list">
                    <div class="detail-row">
                        <span class="detail-label">First name</span>
                        <span class="detail-value" id="profileFirstName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Last name</span>
                        <span class="detail-value" id="profileLastName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="profileEmailValue"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Image</span>
                        <span class="detail-value" id="profileImageValue"></span>
                    </div>
                </div>
            </article>
        </section>
    </div>
</main>

<script>
    const lookupForm = document.querySelector("#profileLookupForm");
    const emailInput = document.querySelector("#profileEmail");
    const feedback = document.querySelector("#profileFeedback");
    const emptyProfile = document.querySelector("#emptyProfile");
    const profileDetails = document.querySelector("#profileDetails");
    const loadButton = lookupForm.querySelector('button[type="submit"]');

    function showFeedback(message, type) {
        feedback.textContent = message;
        feedback.className = `feedback ${type}`;
    }

    function clearFeedback() {
        feedback.textContent = "";
        feedback.className = "feedback";
    }

    function getInitials(user) {
        return `${user.firstName.charAt(0)}${user.lastName.charAt(0)}`.toUpperCase();
    }

    function showProfile(user) {
        document.querySelector("#avatarInitials").textContent = getInitials(user);
        document.querySelector("#profile-title").textContent = `${user.firstName} ${user.lastName}`;
        document.querySelector("#profileUsername").textContent = user.username;
        document.querySelector("#profileFirstName").textContent = user.firstName;
        document.querySelector("#profileLastName").textContent = user.lastName;
        document.querySelector("#profileEmailValue").textContent = user.email;
        document.querySelector("#profileImageValue").textContent = user.image || "No image set";

        emptyProfile.classList.add("hidden");
        profileDetails.classList.remove("hidden");
    }

    async function loadProfile(event) {
        event.preventDefault();

        if (!lookupForm.checkValidity()) {
            lookupForm.reportValidity();
            return;
        }

        clearFeedback();
        loadButton.disabled = true;
        loadButton.textContent = "Loading profile...";

        try {
            const email = emailInput.value.trim();
            const response = await fetch(`/users/${encodeURIComponent(email)}`);

            if (!response.ok) {
                profileDetails.classList.add("hidden");
                emptyProfile.classList.remove("hidden");
                showFeedback("No profile found for that email.", "error");
                return;
            }

            const user = await response.json();
            showProfile(user);
            showFeedback("Profile loaded.", "success");
        } catch (error) {
            showFeedback("Cannot reach PayNest right now. Make sure the server is running.", "error");
        } finally {
            loadButton.disabled = false;
            loadButton.textContent = "Load profile";
        }
    }

    function loadEmailFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");

        if (email) {
            emailInput.value = email;
            lookupForm.requestSubmit();
        }
    }

    lookupForm.addEventListener("submit", loadProfile);
    loadEmailFromUrl();
</script>
</body>
</html>
