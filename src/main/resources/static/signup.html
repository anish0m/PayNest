<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--cloud);
            color: var(--ink);
            font-family: var(--font-body);
        }

        .signup-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(22rem, 0.92fr) minmax(28rem, 1.08fr);
            background: var(--paper);
        }

        .visual-panel {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background: var(--paper);
        }

        .visual-panel img {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .form-panel {
            min-height: 100vh;
            background-color: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem clamp(1.5rem, 5vw, 5.5rem);
        }

        .signup-content {
            width: min(100%, 28rem);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 3rem;
        }

        .brand-mark {
            width: 3.25rem;
            height: 3.25rem;
            object-fit: cover;
            display: block;
        }

        .brand-name {
            margin: 0;
            color: var(--ink);
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        h1 {
            margin-bottom: 0.65rem;
            color: var(--ink);
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 2.65rem);
            line-height: 1.12;
            letter-spacing: 0;
        }

        .intro-text,
        .form-text,
        .signin-copy {
            color: var(--ink-soft);
        }

        .intro-text {
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-label {
            color: var(--ink-soft);
            font-weight: 600;
        }

        .form-control {
            min-height: 3rem;
            color: var(--ink);
            background-color: var(--cloud);
            border-color: var(--pw-ash-300);
            border-radius: 0.5rem;
        }

        .form-control:focus {
            background-color: var(--paper);
            border-color: var(--pw-blue-500);
            box-shadow: 0 0 0 0.2rem var(--pw-blue-100);
        }

        .btn-primary-paynest {
            min-height: 3.1rem;
            border: 0;
            border-radius: 0.5rem;
            background: var(--pw-blue-500);
            color: var(--paper);
            font-weight: 700;
        }

        .btn-primary-paynest:hover,
        .btn-primary-paynest:focus {
            background: var(--pw-blue-700);
            color: var(--paper);
        }

        .signin-link {
            color: var(--pw-blue-700);
            font-weight: 700;
            text-decoration: none;
        }

        .signin-link:hover {
            color: var(--pw-blue-500);
            text-decoration: underline;
        }

        @media (max-width: 991.98px) {
            .signup-page {
                grid-template-columns: 1fr;
            }

            .visual-panel {
                min-height: 18rem;
            }

            .visual-panel img {
                min-height: 18rem;
                max-height: 28rem;
            }

            .form-panel {
                min-height: auto;
                padding-block: 2.5rem;
            }

            .brand-row {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
<main class="signup-page">
    <section class="visual-panel" aria-label="PayNest illustration">
        <img src="public/paynest-split-screen.png" alt="A blue bird protecting coins in a nest">
    </section>

    <section class="form-panel" aria-labelledby="signup-title">
        <div class="signup-content">
            <div class="brand-row">
                <img class="brand-mark" src="public/paynest-logo.png" alt="" aria-hidden="true">
                <p class="brand-name">PayNest</p>
            </div>

            <h1 id="signup-title">Welcome to PayNest</h1>
            <p class="intro-text">A safe little nest for your money.</p>

            <form>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="firstName" class="form-label">First name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName"
                               autocomplete="given-name" required>
                    </div>

                    <div class="col-sm-6">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName"
                               autocomplete="family-name" required>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="col-12">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="new-password" minlength="8" maxlength="72" required>
                        <div class="form-text">Use 8 to 72 characters.</div>
                    </div>

<!--                    <div class="col-12">-->
<!--                        <label for="image" class="form-label">Profile image</label>-->
<!--                        <input type="file" class="form-control" id="image" name="image" accept="image/*">-->
<!--                    </div>-->
                </div>

                <button type="submit" class="btn btn-primary-paynest w-100 mt-4">Create account</button>
            </form>

            <p class="signin-copy mt-4 mb-0 text-center">
                Already have an account?
                <a class="signin-link" href="profile.html">View profile</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
