<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest Admin</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Apply the saved theme before anything paints (no flash). -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('paynest.theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <nav class="navbar border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="app.html">
                <img src="img/logo.png" alt="" width="32" height="32">PayNest
                <span class="badge text-bg-danger">Admin</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-theme-toggle
                        aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
                    <span class="theme-icon-light">☀️</span>
                    <span class="theme-icon-dark">🌙</span>
                </button>
                <a class="btn btn-outline-secondary btn-sm" href="app.html">My wallet</a>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="logout-btn">Log out</button>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="admin-main" hidden>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h4 mb-0">Users <span class="badge text-bg-secondary align-middle" id="user-count"></span></h1>
            <input class="form-control" id="user-search" type="search" style="max-width: 18rem"
                   placeholder="Search name, email, @username" aria-label="Search users">
        </div>
        <section class="card shadow-sm" aria-busy="true" id="users-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col" class="d-none d-md-table-cell">Email</th>
                            <th scope="col">Role</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-rows">
                        <tr><td colspan="4"><span class="placeholder col-6" aria-hidden="true"></span></td></tr>
                    </tbody>
                </table>
            </div>
            <p class="text-body-secondary small p-3 mb-0 d-none" id="users-empty"></p>
            <div class="alert alert-danger d-flex justify-content-between align-items-center m-3 d-none" id="users-error" role="alert">
                <span>Could not load users.</span>
                <button type="button" class="btn btn-sm btn-outline-danger" id="users-retry">Retry</button>
            </div>
        </section>
    </main>

    <!-- Edit user modal -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="edit-form" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5" id="edit-title">Edit user</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-body-secondary small" id="ed-email"></p>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="ed-first">First name</label>
                            <input class="form-control" id="ed-first" name="firstName" type="text" maxlength="100" required>
                            <div class="invalid-feedback" data-for="firstName"></div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="ed-last">Last name</label>
                            <input class="form-control" id="ed-last" name="lastName" type="text" maxlength="100" required>
                            <div class="invalid-feedback" data-for="lastName"></div>
                        </div>
                    </div>
                    <label class="form-label" for="ed-image">Picture URL <span class="text-body-secondary">(optional)</span></label>
                    <input class="form-control" id="ed-image" name="image" type="url" maxlength="512" placeholder="https://…">
                    <div class="invalid-feedback" data-for="image"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="ed-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete user modal (typed confirm) -->
    <div class="modal fade" id="rm-modal" tabindex="-1" aria-labelledby="rm-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="rm-form" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5 text-danger" id="rm-title">Delete user</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>This permanently deletes the account. It cannot be undone.</p>
                    <label class="form-label" for="rm-confirm">Type <strong id="rm-email"></strong> to confirm:</label>
                    <input class="form-control" id="rm-confirm" type="text" autocomplete="off" spellcheck="false">
                    <div class="alert alert-danger mt-3 mb-0 d-none" id="rm-error" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger" id="rm-submit" disabled>Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
