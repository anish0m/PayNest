<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Apply the saved theme before anything paints (no flash). -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('paynest.theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <nav class="navbar border-bottom">
        <div class="container">
            <span class="navbar-brand fw-semibold d-flex align-items-center gap-2">
                <img src="img/logo.png" alt="" width="32" height="32">PayNest
            </span>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-theme-toggle
                    aria-label="Toggle light/dark theme">
                <span class="theme-icon-light">☀️ Light</span>
                <span class="theme-icon-dark">🌙 Dark</span>
            </button>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div id="auth-alert" class="alert d-none" role="alert"></div>

                        <!-- Login panel -->
                        <section id="login-panel">
                            <h1 class="h4 mb-4">Log in</h1>
                            <form id="login-form" novalidate>
                                <div class="mb-3">
                                    <label for="login-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="login-email" name="email"
                                           autocomplete="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-4">
                                    <label for="login-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="login-password" name="password"
                                           autocomplete="current-password" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Log in</button>
                            </form>
                            <p class="text-center mt-3 mb-0">
                                Don't have an account? <a href="#signup" data-show="signup">Sign up!</a>
                            </p>
                        </section>

                        <!-- Signup panel -->
                        <section id="signup-panel" class="d-none">
                            <h1 class="h4 mb-4">Sign up</h1>
                            <form id="signup-form" novalidate>
                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="signup-firstName" class="form-label">First name</label>
                                        <input type="text" class="form-control" id="signup-firstName" name="firstName"
                                               autocomplete="given-name" maxlength="100" required>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="signup-lastName" class="form-label">Last name</label>
                                        <input type="text" class="form-control" id="signup-lastName" name="lastName"
                                               autocomplete="family-name" maxlength="100" required>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="signup-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="signup-email" name="email"
                                           autocomplete="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="signup-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="signup-password" name="password"
                                           autocomplete="new-password" minlength="8" maxlength="72" required
                                           aria-describedby="signup-password-help">
                                    <div id="signup-password-help" class="form-text">8 to 72 characters.</div>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-4">
                                    <label for="signup-image" class="form-label">Profile picture (optional)</label>
                                    <!-- Disabled: CreateUserRequest has no image field yet (plan §9 Q1). -->
                                    <input type="file" class="form-control" id="signup-image" accept="image/*" disabled
                                           aria-describedby="signup-image-help">
                                    <div id="signup-image-help" class="form-text">Coming soon.</div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Create account</button>
                            </form>
                            <p class="text-center mt-3 mb-0">
                                Already have an account? <a href="#login" data-show="login">Log in!</a>
                            </p>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
