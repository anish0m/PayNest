<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayNest</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Apply the saved theme before anything paints (no flash). -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('paynest.theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-body">
    <button type="button" class="btn btn-outline-secondary btn-sm auth-theme" data-theme-toggle
            aria-label="Toggle light/dark theme">
        <span class="theme-icon-light">☀️ Light</span>
        <span class="theme-icon-dark">🌙 Dark</span>
    </button>

    <main class="auth-page">
        <svg class="auth-waves" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="none">
            <path d="M0 120 C240 40 420 220 720 140 S1200 20 1440 110 V0 H0Z"/>
            <path d="M0 220 C300 120 520 320 820 220 S1260 120 1440 200 V0 H0Z"/>
            <path d="M0 300 C180 380 260 520 140 640 S60 820 0 900Z"/>
            <path d="M0 180 C260 300 380 480 240 620 S120 820 180 900 H0Z"/>
            <path d="M1440 260 C1240 360 1180 520 1300 640 S1400 820 1360 900 H1440Z"/>
            <path d="M1440 160 C1180 300 1100 500 1220 660 S1320 840 1250 900 H1440Z"/>
            <path d="M0 780 C260 700 520 860 800 780 S1240 680 1440 760 V900 H0Z"/>
            <path d="M0 700 C320 620 560 820 860 720 S1280 600 1440 690 V900 H0Z"/>
        </svg>
        <div class="auth-card">
        <div class="auth-left">
            <div class="auth-form-wrap">
                <div class="auth-logo"><img src="img/logo.png" alt="PayNest logo" width="64" height="64"></div>
                <div>
                    <div>
                        <div id="auth-alert" class="alert d-none" role="alert"></div>

                        <!-- Login panel -->
                        <section id="login-panel">
                            <h1 class="auth-title">Log in to PayNest</h1>
                            <form id="login-form" novalidate>
                                <div class="mb-3">
                                    <label for="login-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="login-email" name="email"
                                           autocomplete="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="login-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="login-password" name="password"
                                           autocomplete="current-password" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <!-- Remember me / Forgot password: UI only until the backend supports them. -->
                                <div class="d-flex justify-content-between align-items-center mb-4 small">
                                    <div class="form-check mb-0">
                                        <input class="form-check-input" type="checkbox" id="login-remember" name="remember">
                                        <label class="form-check-label" for="login-remember">Remember me</label>
                                    </div>
                                    <a href="#" data-soon="Password reset">Forgot password?</a>
                                </div>
                                <button type="submit" class="btn btn-auth w-100">Log in</button>
                            </form>
                            <p class="text-center mt-3 mb-0">
                                Don't have an account? <a href="#signup" data-show="signup"><strong>Sign up</strong></a>
                            </p>
                        </section>

                        <!-- Signup panel -->
                        <section id="signup-panel" class="d-none">
                            <h1 class="auth-title">Sign up for PayNest</h1>
                            <form id="signup-form" novalidate>
                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="signup-firstName" class="form-label">First name</label>
                                        <input type="text" class="form-control" id="signup-firstName" name="firstName"
                                               autocomplete="given-name" maxlength="100" required>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="signup-lastName" class="form-label">Last name</label>
                                        <input type="text" class="form-control" id="signup-lastName" name="lastName"
                                               autocomplete="family-name" maxlength="100" required>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="signup-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="signup-email" name="email"
                                           autocomplete="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="signup-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="signup-password" name="password"
                                           autocomplete="new-password" minlength="8" maxlength="72" required
                                           aria-describedby="signup-password-help">
                                    <div id="signup-password-help" class="form-text">8 to 72 characters.</div>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-4">
                                    <label for="signup-image" class="form-label">Profile picture (optional)</label>
                                    <!-- Disabled: CreateUserRequest has no image field yet (plan §9 Q1). -->
                                    <input type="file" class="form-control" id="signup-image" accept="image/*" disabled
                                           aria-describedby="signup-image-help">
                                    <div id="signup-image-help" class="form-text">Coming soon.</div>
                                </div>
                                <button type="submit" class="btn btn-auth w-100">Create account</button>
                            </form>
                            <p class="text-center mt-3 mb-0">
                                Already have an account? <a href="#login" data-show="login"><strong>Log in</strong></a>
                            </p>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-right" aria-hidden="true">
            <div class="auth-hero">
                <div class="auth-hero-logo"><img src="img/logo.png" alt="" width="200" height="200"></div>
                <div class="auth-hero-title">PayNest</div>
                <div class="auth-hero-tag">Where Your Money Feels At Home</div>
            </div>
        </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
